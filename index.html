        // Intersection Observer for Reveals
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, { threshold: 0.1 });

        function initReveals() {
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        // Waitlist Form Logic
        document.getElementById('waitlist-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('final-btn');
            const form = document.getElementById('waitlist-form');
            const success = document.getElementById('success-msg');

            btn.innerText = "...";
            btn.disabled = true;

            const formData = {
                email: document.getElementById('in-email').value,
                first_name: document.getElementById('in-name').value,
                user_type: document.querySelector('input[name="userType"]:checked').value
            };

            try {
                // Use Supabase JS Client
                const { data, error } = await supabase
                    .from('waitlist')
                    .insert([formData]);

                if (error) throw error;

                form.classList.add('hidden');
                success.classList.remove('hidden');
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#6C3CE1', '#FFFFFF', '#0D0D2B']
                });
            } catch (err) {
                alert("Error: " + err.message);
                btn.innerText = translations[currentLocale].final.form.btn;
                btn.disabled = false;
            }
        });

        // Counter Animation
        function animateCounter() {
            const counterEl = document.getElementById('soc-counter');
            let start = 0;
            const end = 1248;
            const duration = 2000;
            const step = (timestamp) => {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                counterEl.innerText = Math.floor(progress * (end - start) + start) + "+";
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            let startTime = null;
            window.requestAnimationFrame(step);
        }

        // Initialize
        window.onload = () => {
            const saved = localStorage.getItem('hosty-locale');
            if (saved) setLanguage(saved);
            else setLanguage('fr');

            initReveals();

            // Setup Supabase (User must replace with their own keys)
            window.supabase = supabase.createClient(
                'YOUR_SUPABASE_URL',
                'YOUR_SUPABASE_ANON_KEY'
            );
        };

        // Run counter when in view
        const counterObserver = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                animateCounter();
                counterObserver.unobserve(entries[0].target);
            }
        }, { threshold: 0.5 });
        counterObserver.observe(document.getElementById('soc-counter'));

    </script>
